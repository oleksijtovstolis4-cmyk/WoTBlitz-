.gold{font-size:20px;color:#ffd24d;font-weight:bold}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;color:#fff;background:#3d7bff}
button:disabled{opacity:.4}
button.g{background:#2e9e5b}button.r{background:#c23b3b}button.d{background:#2a3347}
.wrap{padding:12px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161c28;border-top:1px solid #263047;z-index:5}
.nav button{flex:1;border-radius:0;background:none;padding:15px 2px;font-size:12px;white-space:nowrap;color:#8a93a6}
.nav button.on{color:#fff;background:#222b3d}
.sub{display:flex;gap:8px;margin-bottom:12px}
.sub button{flex:1;background:#222b3d;color:#8a93a6}
.sub button.on{background:#3d7bff;color:#fff}
.box{background:#1b2230;border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}
.big{font-size:54px}
small,.mut{color:#8a93a6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.it{background:#1b2230;border-radius:10px;border-bottom:4px solid;padding:8px;font-size:13px;text-align:center}
.it button{padding:6px 10px;font-size:13px;margin-top:6px}
.bar{height:8px;background:#2a3347;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#ffd24d}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;display:none;align-items:center;justify-content:center;padding:12px}
#mc{background:#161c28;border-radius:16px;padding:14px;width:100%;max-width:480px;max-height:90vh;overflow:auto;text-align:center}
.pack{display:flex;justify-content:space-between;align-items:center;background:#1b2230;border-radius:10px;padding:10px 12px;margin:8px 0;text-align:left}
.pack b{font-size:17px}
#roll{position:relative;overflow:hidden;height:130px;background:#181e2a;border-radius:12px;margin:10px 0}
#roll::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ffd24d;z-index:2}
#strip{display:flex;height:100%;align-items:center}
.card{flex:0 0 96px;height:104px;margin:0 3px;border-radius:10px;background:#222a3a;border-bottom:5px solid;display:flex;flex-direction:column;justify-content:center;font-size:11px;padding:3px}
.card b{font-size:24px;display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #263047;font-size:14px;text-align:left}
.sec{border-top:1px solid #263047;margin-top:12px;padding-top:12px}
input.pi{width:100%;padding:14px;font-size:17px;border-radius:10px;border:1px solid #2a3347;background:#10141c;color:#fff;text-align:center;margin:12px 0;outline:none}
input.pi:focus{border-color:#3d7bff}
.silv{font-size:14px;color:#c4ccdb;margin-top:2px}
.ver{text-align:center;color:#5d667a;font-size:12px;padding:8px 0 4px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2e9e5b;padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:90%;text-align:center}

function valid(s){
  if(!s||typeof s!=='object')return false;
  if(!isN(s.gold)||!isN(s.bonus))return false;
  for(const k of ['cont','tal','cert','tanks','res','promos'])if(!s[k]||typeof s[k]!=='object')return false;
  for(const k of ['cont','tal','cert','tanks','res'])for(const x in s[k])if(!isN(s[k][x]))return false;
  return true;
}

function parse(raw){

    if(r&&typeof r.d==='string'&&r.h===SG(r.d)){
      const s=JSON.parse(r.d);
      if(valid(s)){if(!isN(s.afk))s.afk=0;return s}

  }catch(e){}
  return null;
}

function rewardCount(c){
  const tot=c.count.reduce((a,r)=>a+r[1],0);
  let r=Math.random()*tot;
  for(const [n,w] of c.count){r-=w;if(r<0)return n}
  return c.count[0][0];
}
function pickMany(c,n){
  let pool=c.drops.slice();const res=[];
  for(let k=0;k<n&&pool.length;k++){
    const tot=pool.reduce((a,d)=>a+d.w,0);
    let r=Math.random()*tot,idx=pool.length-1;
    for(let j=0;j<pool.length;j++){r-=pool[j].w;if(r<0){idx=j;break}}
    const d=pool[idx];res.push(d);
    pool=pool.filter(x=>x.g!==d.g);
  }
  return res;
}
function info(d){
  if(d.t==='tank'){const t=TANKS[d.i];return{ic:t[1],n:t[0],s:ROM[t[3]]+' · '+t[2],c:TCOL[t[3]]}}
  return{ic:d.ic,n:d.n,s:d.s,c:d.s==='Бустер'?'#2cc7c7':(d.key==='silver'?'#9aa4b5':(d.key==='gold'?'#ffd24d':'#ff6fb0'))};

function apply(d){

const CH={};
function chances(c){
  if(CH[c.id])return CH[c.id];
  const cnt={},N=20000;
  for(let i=0;i<N;i++)pickMany(c,rewardCount(c)).forEach(d=>{cnt[d.id]=(cnt[d.id]||0)+1});
  const r={};for(const k in cnt)r[k]=cnt[k]/N*100;
  CH[c.id]=r;return r;
}

function useCert(id){
  const c=CB(id);
  if(!c||c.direct||c.noTal)return;
  if(gv(S.cert,id)<1)return;
  S.cert[id]--;
  const d={t:'tank',i:TI(c.tanks[Math.floor(Math.random()*c.tanks.length)])};
  apply(d);save();render();
  modal('<h3 style="margin-top:0">'+c.cert+'</h3><div style="display:flex;justify-content:center">'+cardH(d)+'</div><br><button'+at('closeM')+'>Отлично</button>');
}

// ================= ОТКРЫТИЕ =================
function openOne(id){
  const c=CB(id);
  if(!c||busy||gv(S.cont,id)<1)return;
  busy=true;S.cont[id]--;if(!c.noTal)S.tal[id]=gv(S.tal,id)+1;
  const rewards=pickMany(c,rewardCount(c));
  rewards.forEach(apply);save();render();
  const win=rewards.slice().sort((a,b)=>a.w-b.w)[0];
  const WIN=40,items=[];
  for(let i=0;i<50;i++)items.push(c.drops[Math.floor(Math.random()*c.drops.length)]);
  items[WIN]=win;
  modal('<h3 style="margin-top:0">Открываем...</h3><div id="roll"><div id="strip">'+items.map(cardH).join('')+'</div></div><div id="rr"></div>');
  setTimeout(()=>{
    const st=$('strip'),cw=$('roll').clientWidth,cwid=102;
    const tg=WIN*cwid+cwid/2-cw/2+(Math.random()*40-20);
    st.style.transition='transform 5s cubic-bezier(.12,.7,.1,1)';
    st.style.transform='translateX('+(-tg)+'px)';
  },60);
  setTimeout(()=>{
    busy=false;
    let h='<h3 style="margin:8px 0">Награды ('+rewards.length+')</h3>'+
    (c.noTal?'':'<div class="row"><span>🗿 <b>'+c.tal+'</b><br><small>Гарантированно</small></span></div>')+
    rewards.map(rowH).join('')+'<br><button'+at('closeM')+'>Забрать</button>';
    if(gv(S.cont,id)>0)h+=' <button class="g"'+at('openOne',id)+'>Ещё раз</button>';
    $('rr').innerHTML=h;
    render();
  },5300);
}
function openAll(id){
  const c=CB(id),n=c?gv(S.cont,id):0;
  if(!c||busy||n<1)return;
  S.cont[id]=0;if(!c.noTal)S.tal[id]=gv(S.tal,id)+n;
  const got={};
  for(let i=0;i<n;i++){
    pickMany(c,rewardCount(c)).forEach(d=>{
      apply(d);
      const f=info(d),key=f.ic+' '+f.n;
      got[key]=(got[key]||0)+1;
    });
  }
  save();render();
  let h='<h3 style="margin-top:0">Открыто: '+n+'</h3>'+(c.noTal?'':'<div class="row"><span>🗿 '+c.tal+'</span><b>×'+n+'</b></div>');
  Object.keys(got).forEach(k=>{h+='<div class="row"><span>'+k+'</span><b>×'+got[k]+'</b></div>'});
  h+='<br><button'+at('closeM')+'>Забрать</button>';
  modal(h);
}

// ================= АФК ФАРМ =================
// Золото идёт только пока открыта эта вкладка и страница видна на экране.
function afkPage(){
  const pct=Math.min(100,acc/AFK_MS*100);
  return '<div class="box"><div class="big">💤</div><h3 style="margin:6px 0">АФК ФАРМ</h3>'+
  '<small>Оставайтесь на этой вкладке: каждую минуту +'+fmt(AFK_GOLD)+' 🪙.<br>Если уйдёте на другую вкладку, отсчёт сбросится. Если свернёте браузер, фарм встанет на паузу.</small>'+
  '<div class="bar" style="height:12px;margin:18px 0 8px"><i id="afkbar" style="width:'+pct+'%"></i></div>'+
  '<div id="afkt">'+afkText()+'</div>'+
  '<div class="sec">Всего получено за фарм: <b id="afkTot">'+fmt(S.afk)+'</b> 🪙</div></div>';
}
function afkText(){return 'До награды: '+Math.ceil((AFK_MS-acc)/1000)+' сек.'}
function afkUi(){
  const b=$('afkbar');
  if(!b)return;
  b.style.width=Math.min(100,acc/AFK_MS*100)+'%';
  $('afkt').textContent=afkText();
  $('afkTot').textContent=fmt(S.afk);
}
setInterval(()=>{
  const now=performance.now(),dt=Math.min(now-last,1000);
  last=now;
  if(page!=='afk'){acc=0;return}
  if(document.hidden)return;
  acc+=dt;
  if(acc>=AFK_MS){
    acc-=AFK_MS;
    S.gold+=AFK_GOLD;S.afk+=AFK_GOLD;save();
    $('gold').textContent=fmt(S.gold);
    toast('+'+fmt(AFK_GOLD)+' 🪙 АФК фарм');
  }
  afkUi();
},250);
// если игра открыта в нескольких вкладках браузера, подтягиваем свежее сохранение
window.addEventListener('storage',e=>{
  if(e.key!==KEY||e.newValue===null)return;
  const n=parse(e.newValue);
  if(n){S=n;if(!busy)render()}
});

// ================= ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ И СОБЫТИЯ =================
const ACT={
  go:v=>{const q=v[0];page=(q==='inv'||q==='promo'||q==='afk')?q:'shop';if(page!=='afk')acc=0;render()},
  sub:v=>{sub=v[0]==='tank'?'tank':'cont';render()},
  shopModal:v=>shopModal(v[0]),
  dropsModal:v=>dropsModal(v[0]),
  buy:v=>buy(v[0],parseInt(v[1],10)),
  closeM:()=>closeM(),
  activate:()=>activate(),
  openOne:v=>openOne(v[0]),
  openAll:v=>openAll(v[0]),
  craft:v=>craft(v[0]),
  useCert:v=>useCert(v[0]),
  sell:v=>sell(parseInt(v[0],10)),
  doSell:v=>doSell(parseInt(v[0],10)),
  actGold:v=>actGold(v[0])
};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t&&t.id==='ov'){closeM();return}
  const el=t&&t.closest?t.closest('[data-a]'):null;
  if(!el||el.disabled)return;
  const a=el.getAttribute('data-a');
  if(Object.prototype.hasOwnProperty.call(ACT,a))ACT[a]((el.getAttribute('data-v')||'').split('|'));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='pc')activate();
});
$('bonus').addEventListener('click',()=>{
  const left=S.bonus+BONUS_CD-Date.now();
  if(left>0){toast('Бонус через '+Math.ceil(left/1000)+' сек.',1);return}
  S.gold+=1500;S.bonus=Date.now();save();render();toast('+1500 🪙');
});

function render(){
  $('gold').textContent=fmt(S.gold);
  $('silver').textContent=fmt(gv(S.res,'silver'));
  $('n-shop').className=page==='shop'?'on':'';
  $('n-inv').className=page==='inv'?'on':'';
  $('n-promo').className=page==='promo'?'on':'';
  $('n-afk').className=page==='afk'?'on':'';
  $('main').innerHTML=page==='shop'?shopPage():page==='inv'?invPage():page==='afk'?afkPage():promoPage();
}
render();
if(tampered){save();toast('Обнаружено изменение сохранения. Прогресс сброшен.',1)}
})();
</script>
